<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FO-07 Secure Frontend</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 font-sans">
    <script src="script.js"></script>

    <header class="bg-blue-600 text-white p-2">
        <h1 class="text-[50px] font-bold text-center">Welcome to Demo Votes checker</h1>
        <p class="text-center text-[30px]">Give Your Detials And Check Wheater You Are Eligible For Vote Or Not</p>
    </header>
    
    <div class="flex  gap-x-14" >

    <div class="border border-black rounded-lg p-5 m-12  w-[300px]">
        <form>
            <label for="username">Username:</label><br>
        <input type="text" name="username" class="border border-black  rounded-md p-2"><br><br>
            <label for="Address">Address:</label><br>
        <input type="text" name="Address" class="border border-black  rounded-md p-2"><br><br>
            <label for="Phone No.">Phone No.</lable><br>
        <input type="number" name="Phone Number" class="border border-black  rounded-md p-2"><br><br>
            <label for="Email">Email:</lable><br>
        <input type="Email" name="Email" class="border border-black  rounded-md p-2"><br><br>
        <button class="bg-green-500 border border-black rounded-md block mx-auto">Submit</button>
        </form>
    </div>

    <div class="border border-black rounded-lg p-5 m-12  w-[300px] h-[225px]">
        <form>
            <label for="username">Enter Your Name:</label><br>
        <input type="text" name="username" class="border border-black  rounded-md p-2"><br>
            <label for="Age">Enter Your Age:</label><br>
        <input type="number" name="Age" class="border border-black  rounded-md p-2"><br><br>
        <button class="bg-green-500 border border-black rounded-md block mx-auto">Submit</button>
        </form>
    </div>

    <div class="border border-black rounded-lg p-5 m-12 w-[290px] h-[450px]">
        <form>
            <label for="Name">Enter Your Name:</label><br>
            <input type="text" name="User Name" class="border border-black rounded-md p-2"><br><br>
            <label for="Phone No:">Mobile:</label><br>
            <input type="number" name="Phone Number" class="border border-black rounded-md p-2"><br><br>
            <label for="Feedback">Feedback</label><br>
            <input type="Feedback" name="Feedback from user" class="border border-black rounded-md p-2"><br><br>
            <button class="border border-black rounded-md bg-green-500 block mx-auto">Submit</button><br>
            <h1 class="text-[30px] font-sans text-pink-700">LET'S VOTE FOR RIGHT DECISION</h1>
        </form>
    </div>
    </div>
    <img src="https://thumbs.dreamstime.com/b/business-man-shows-hand-upwards-cartoon-businessman-85545785.jpg" alt="person"
    class="w-[300px] h-[190px] center block mx-auto -m-60">
